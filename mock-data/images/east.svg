<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sunrise spreading light over an eastern horizon.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    
    <radialGradient id="sunGlow" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="rgba(255, 223, 138, 0.9)"/>
      <stop offset="100%" stop-color="rgba(255, 223, 138, 0)"/>
    </radialGradient>
    
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  
    <rect y="360" width="960" height="240" fill="#0f172a" opacity="0.85"/>
    <circle cx="480" cy="360" r="140" fill="url(#sunGlow)"/>
    <circle cx="480" cy="360" r="110" fill="#fbbf24" opacity="0.95"/>
    <g stroke="#fbbf24" stroke-width="10" stroke-linecap="round">
      <line x1="480" y1="360" x2="480" y2="232"/>
      <line x1="480" y1="360" x2="612" y2="304"/>
      <line x1="480" y1="360" x2="348" y2="304"/>
      <line x1="480" y1="360" x2="620" y2="360"/>
      <line x1="480" y1="360" x2="340" y2="360"/>
    </g>
    <rect y="360" width="960" height="36" fill="#f59e0b" opacity="0.9"/>
    
  <rect x="40" y="36" width="360" height="140" rx="22" fill="#0b0f1a" opacity="0.65"/>
  <text x="64" y="98" fill="#f8fafc" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="700">East</text>
  <text x="64" y="136" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="500">The direction where the sun rises.</text>
  <text x="64" y="168" fill="#cbd5e1" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600">noun · CEFR B1</text>
</svg>